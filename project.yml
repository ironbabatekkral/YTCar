name: YTCar
options:
  bundleIdPrefix: com.bekir
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  YTCar:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bekir.ytcar
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # Car screen needs Apple's carplay-video entitlement; see README.
        CODE_SIGN_ENTITLEMENTS: ""
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: YTCar
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Phone
                UISceneClassName: UIWindowScene
                UISceneDelegateClassName: PhoneSceneDelegate
            UIWindowSceneSessionRoleCarPlay:
              - UISceneConfigurationName: CarPlay
                UISceneClassName: UIWindowScene
                UISceneDelegateClassName: CarSceneDelegate
